# Sized for a 16 GB PC with other apps open: Flutter's default (-Xmx8G) let Windows grow its page file until
# the disk was full. 3 GB is plenty for this app; no heap dump (it would be gigabytes on a nearly full disk).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
# Kotlin compiles inside the Gradle daemon instead of starting a second Java process.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
