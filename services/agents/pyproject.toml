[project]
name = "gudmeal-agents"
version = "0.1.0"
description = "Gud Meal LangGraph multi-agent service (Gemini). Acts only through gudmeal-api tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.160",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-google-genai>=3.0",
  "langgraph-checkpoint-postgres>=3.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "firebase-admin>=6.6",
  "langsmith>=0.3",
  "tzdata>=2024.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "gudmeal-api",
]

[tool.uv.sources]
gudmeal-api = { path = "../api", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gudmeal_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live_gemini: calls the real Gemini API (requires GOOGLE_API_KEY)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501", "S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
