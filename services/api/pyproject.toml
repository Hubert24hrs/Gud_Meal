[project]
name = "gudmeal-api"
version = "0.1.0"
description = "Gud Meal core API: catalog, pricing, orders, payments, ledger, dispatch"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.160",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "firebase-admin>=6.6",
  "google-cloud-firestore>=2.19",
  "google-cloud-pubsub>=2.27",
  "google-cloud-tasks>=2.17",
  "google-auth>=2.36",
  "httpx>=0.28",
  "tzdata>=2024.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gudmeal_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "firestore: requires the Firestore emulator (FIRESTORE_EMULATOR_HOST)",
  "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["E501", "S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012", "S311", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
