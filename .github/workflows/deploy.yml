name: Deploy to Cloud Run

# Manual, environment-gated deployments. Configure GitHub Environments "development", "staging" and
# "production" (production with required reviewers) and these per-environment variables/secrets:
#   vars.GCP_PROJECT_ID, vars.GCP_REGION, vars.ARTIFACT_REPO
#   secrets.GCP_WORKLOAD_IDENTITY_PROVIDER, secrets.GCP_DEPLOY_SERVICE_ACCOUNT   (Workload Identity Federation — no JSON keys)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, staging, production]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.ARTIFACT_REPO }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & push images (Cloud Build)
        run: |
          gcloud builds submit --project "$PROJECT" --config infra/cloudbuild/cloudbuild.yaml \
            --substitutions "_REGION=$REGION,_REPO=$REPO,_TAG=$TAG" .
      - name: Run database migrations (Cloud Run job)
        run: |
          gcloud run jobs deploy gudmeal-migrate --project "$PROJECT" --region "$REGION" \
            --image "$REGION-docker.pkg.dev/$PROJECT/$REPO/gudmeal-api:$TAG" \
            --service-account "gudmeal-api@$PROJECT.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$PROJECT:$REGION:gudmeal-sql" \
            --set-secrets "DATABASE_URL=api-database-url:latest" \
            --command alembic --args upgrade,head
          gcloud run jobs execute gudmeal-migrate --project "$PROJECT" --region "$REGION" --wait
      - name: Deploy services
        run: infra/scripts/deploy.sh "${{ inputs.environment }}" "$PROJECT" "$REGION" "$REPO" "$TAG"
